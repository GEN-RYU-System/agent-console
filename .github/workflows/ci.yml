name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # tmux の統合試験に必要（tmux が無いと CI では失敗にする）
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      # apt の tmux は 3.4（pane_private_modes が無い）。モードを戻すのは 3.8 以上なので、公式の 3.8 リリースをビルドする
      - name: Install tmux 3.8 (Linux, official release tarball)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev
          curl -fsSL -o "$RUNNER_TEMP/tmux-3.8.tar.gz" https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz
          echo "e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e  $RUNNER_TEMP/tmux-3.8.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/tmux-src"
          tar -xzf "$RUNNER_TEMP/tmux-3.8.tar.gz" -C "$RUNNER_TEMP/tmux-src" --strip-components=1
          cd "$RUNNER_TEMP/tmux-src"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
      - name: tmux version
        run: tmux -V
      # 件のセッションの zsh 関数の試験（ccdiscord-zsh.test.ts）に必要
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh
      - run: npm ci
      - name: npm audit (moderate 以上で失敗)
        run: npm audit --audit-level=moderate
      - name: npm audit signatures (レジストリ署名・provenance の検証)
        run: npm audit signatures

      # Sales Anchor（public）を salesanchorRoot として取得し、金型・トークンを .sa-cache へ展開する
      - name: Clone Sales Anchor
        run: git clone --depth 1 https://github.com/shingo-ops/salesanchor.git "$RUNNER_TEMP/salesanchor"
      - name: Point config at the clone
        run: node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("agent-console.config.json","utf8"));c.salesanchorRoot=process.env.RUNNER_TEMP+"/salesanchor";fs.writeFileSync(process.env.RUNNER_TEMP+"/ci-config.json",JSON.stringify(c))'
      - name: sa-sync
        run: node scripts/sa-sync.mjs
        env:
          AGENT_CONSOLE_CONFIG: ${{ runner.temp }}/ci-config.json

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # 所要時間の閾値（設計 §7）は並列実行だと揺れるので、tmux の統合試験だけをファイル並列なしで 1 回、AC_TMUX_TIMING=1 で判定する
      # npm test が赤でも走らせる（並列の負荷が原因か tmux の版が原因かを切り分けるため）
      - name: tmux timing check (single file, no file parallelism)
        if: always()
        env:
          AC_TMUX_TIMING: "1"
        run: npx vitest run tests/unit/tmux-host.integration.test.ts --no-file-parallelism
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
