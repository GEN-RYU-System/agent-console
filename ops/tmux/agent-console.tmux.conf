# Agent Console 専用の tmux 設定。アプリ専用のソケット（-L agent-console）にだけ使う。
# PO が普段使う tmux の設定（~/.tmux.conf）とは読み込みも設定も分ける。
# この設定は tmux サーバーの起動時に 1 回だけ読まれる。版を上げたときのために、アプリのサーバーは起動のたびに source-file でも読み直す。
# 各行の理由は docs/handoff/keep-sessions/step0.md に実測つきで書いてある。

# キーを横取りしない（Ctrl+B などをそのまま中の claude へ渡す）
set -g prefix None
set -g prefix2 None
# 既定のキー割り当てを外す（読み直しても失敗しないよう -q）
unbind -q -a
unbind -q -n -a

# マウスは tmux が受け取らない（ホイールで copy-mode に入らない。アプリがマウスを要求したときだけ、そのまま中へ渡る）
set -g mouse off

# 画面の最下行を使わない（xterm.js の画面をそのまま中の claude に渡す）
set -g status off

# Esc を遅らせない
set -g escape-time 0

# 中の端末の種類（screen か tmux かその派生にすること）
set -g default-terminal tmux-256color

# 修飾キー付きのキー（Shift+Enter など）を中の claude へ渡す
set -g extended-keys on
# 読み直しても重ならないよう、いったん既定に戻してから足す
set -gu terminal-features
set -ga terminal-features ",xterm*:extkeys"

# 過去の出力の先入れ（capture-pane）用に残す行数。画面側の xterm.js のスクロールバックと同じ値
set -g history-limit 2000

# 最後のセッションが終わったら tmux サーバーも終わる
set -g exit-empty on

# 選択のコピー（OSC 52）を外の端末まで通す
set -g set-clipboard on
